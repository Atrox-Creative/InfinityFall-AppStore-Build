name: Upload iOS build to App Store Connect

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: infinityfall-app-store-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Sign and upload Infinity Fall
    runs-on: macos-26
    environment: app-store
    timeout-minutes: 120
    env:
      IOS_BUNDLE_ID: com.DefaultCompany.Pelota-rebota
      APPLE_TEAM_ID: B2X6D3A9J9
      APPLE_DISTRIBUTION_CERTIFICATE_ID: 2K3G3RTCS5
      BUILD_NUMBER: ${{ inputs.build_number }}
      IOS_BUILD_PATH: ${{ github.workspace }}/Build
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}

    steps:
      - name: Check out CI configuration
        uses: actions/checkout@v5

      - name: Verify Xcode 26
        shell: bash
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          major_version="${sdk_version%%.*}"
          if [[ "$major_version" -lt 26 ]]; then
            echo "iOS SDK 26 or later is required; found $sdk_version" >&2
            exit 1
          fi

      - name: Check out the private Unity Xcode artifact
        uses: actions/checkout@v5
        with:
          repository: Atrox-Creative/InfinityFall-AppStore-Artifact
          ssh-key: ${{ secrets.BUILD_ARTIFACT_DEPLOY_KEY }}
          path: private-build-artifact
          persist-credentials: false
          fetch-depth: 1

      - name: Reassemble the Unity Xcode project
        shell: bash
        run: |
          cat \
            "$GITHUB_WORKSPACE/private-build-artifact"/InfinityFall-iOS-Xcode-1.0.1-build1.zip.part.* \
            > "$RUNNER_TEMP/InfinityFall-iOS-Xcode-1.0.1-build1.zip"
          echo "2B3A7FC49CCBE64806B4783C253CEAF28143ECB216B82195BC16E8D329A4CC98  $RUNNER_TEMP/InfinityFall-iOS-Xcode-1.0.1-build1.zip" \
            | shasum -a 256 -c -
          ditto -x -k \
            "$RUNNER_TEMP/InfinityFall-iOS-Xcode-1.0.1-build1.zip" \
            "$GITHUB_WORKSPACE"

      - name: Remove duplicate legacy Google Ads objects
        shell: bash
        run: |
          library="$IOS_BUILD_PATH/Libraries/Plugins/iOS/unity-plugin-library.a"
          arm64_library="$RUNNER_TEMP/unity-plugin-library-arm64.a"
          lipo "$library" -thin arm64 -output "$arm64_library"
          duplicate_objects="$(ar -t "$arm64_library" | grep -E 'GADPAID.*\.o$' || true)"
          if [[ -z "$duplicate_objects" ]]; then
            echo "No legacy GADPAID objects were found in unity-plugin-library.a" >&2
            exit 1
          fi
          while IFS= read -r object_name; do
            ar -d "$arm64_library" "$object_name"
          done <<< "$duplicate_objects"
          ranlib "$arm64_library"
          cp "$arm64_library" "$library"

      - name: Install CocoaPods dependencies
        shell: bash
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: |
          cd "$IOS_BUILD_PATH"
          sed -i '' '/github.com\/CocoaPods\/Specs/d' Podfile
          pod install --repo-update

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare signing certificate
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/InfinityFall-Distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$certificate_path"
          echo "IOS_DISTRIBUTION_P12_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$(uuidgen)" >> "$GITHUB_ENV"

      - name: Fix Unity script permissions
        shell: bash
        run: |
          find "$IOS_BUILD_PATH" -type f -name '*.sh' -exec chmod +x {} \;
          find "$IOS_BUILD_PATH" -type f -iname 'usymtool*' -exec chmod +x {} \;

      - name: Sign and upload build 1
        shell: bash
        run: bundle exec fastlane ios upload
