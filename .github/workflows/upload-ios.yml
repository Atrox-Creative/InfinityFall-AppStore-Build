name: Upload iOS build to App Store Connect

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: infinityfall-app-store-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Sign and upload Infinity Fall
    runs-on: macos-26
    environment: app-store
    timeout-minutes: 120
    env:
      IOS_BUNDLE_ID: com.DefaultCompany.Pelota-rebota
      APPLE_TEAM_ID: B2X6D3A9J9
      APPLE_DISTRIBUTION_CERTIFICATE_ID: 2K3G3RTCS5
      BUILD_NUMBER: ${{ inputs.build_number }}
      IOS_BUILD_PATH: ${{ github.workspace }}/Build
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}

    steps:
      - name: Check out CI configuration
        uses: actions/checkout@v5

      - name: Verify Xcode 26
        shell: bash
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          major_version="${sdk_version%%.*}"
          if [[ "$major_version" -lt 26 ]]; then
            echo "iOS SDK 26 or later is required; found $sdk_version" >&2
            exit 1
          fi

      - name: Download the Unity Xcode project
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_url="$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == "ios-xcode-1.0.1-build1") | .assets[] | select(.name == "InfinityFall-iOS-Xcode-1.0.1-build1.zip") | .url'
          )"
          if [[ -z "$asset_url" ]]; then
            echo "The private draft build asset was not found." >&2
            exit 1
          fi
          gh api \
            -H "Accept: application/octet-stream" \
            "$asset_url" > "$RUNNER_TEMP/InfinityFall-iOS-Xcode-1.0.1-build1.zip"
          ditto -x -k \
            "$RUNNER_TEMP/InfinityFall-iOS-Xcode-1.0.1-build1.zip" \
            "$GITHUB_WORKSPACE"

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd "$IOS_BUILD_PATH"
          pod install --repo-update

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare signing certificate
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/InfinityFall-Distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$certificate_path"
          echo "IOS_DISTRIBUTION_P12_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$(uuidgen)" >> "$GITHUB_ENV"

      - name: Fix Unity script permissions
        shell: bash
        run: |
          find "$IOS_BUILD_PATH" -type f -name '*.sh' -exec chmod +x {} \;
          find "$IOS_BUILD_PATH" -type f -iname 'usymtool*' -exec chmod +x {} \;

      - name: Sign and upload build 1
        shell: bash
        run: bundle exec fastlane ios upload
